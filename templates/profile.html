
{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Редактирование профиля</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Назад в кабинет</a>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="card mt-4">
                <div class="card-header">
                    <h5 class="mb-0">Безопасность</h5>
                </div>
                <div class="card-body">
                    <a href="#" class="btn btn-outline-warning">Сменить пароль</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
